name: Docker Image CI

on:
  push:
    branches: [main]

jobs:
  resolve_tag:
    uses: ./.github/workflows/resolve_tag.yml
  alpine:
    needs: resolve_tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push alpine
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/alpharomeo323/mc-doomedchunk:alpine,ghcr.io/alpharomeo323/mc-doomedchunk:latest,ghcr.io/alpharomeo323/mc-doomedchunk:${{ needs.resolve_tag.outputs.tag }}
          cache-from: type=registry,ref=ghcr.io/alpharomeo323/mc-doomedchunk:buildcache
          cache-to: type=registry,ref=ghcr.io/alpharomeo323/mc-doomedchunk:buildcache,mode=max
